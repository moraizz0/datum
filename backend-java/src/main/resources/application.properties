# ---- Servidor ----
server.port=${SERVER_PORT:${PORT:8080}}
# lê o arquivo .env (na pasta backend) como se fosse parte das configurações
spring.config.import=optional:file:.env[.properties]
spring.application.name=datum-backend

# ---- Banco PostgreSQL (Neon) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datum}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA: as tabelas são criadas pelo schema.sql, não pelo Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# ---- JWT, CORS, admin, upload e Python ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@datum.local}
app.admin.senha=${ADMIN_PASSWORD:}
app.upload.max-linhas=${UPLOAD_MAX_LINHAS:5000}
app.etl.enabled=${ETL_ENABLED:true}
app.etl.url=${ETL_URL:http://localhost:8000/etl}
app.etl.key=${ETL_KEY:}

# ---- Logs ----
logging.level.br.com.datum=INFO
